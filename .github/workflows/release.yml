# Builds and publishes a release when a version tag (v0.1.1, ...) is pushed, on a GitHub-hosted
# Windows runner: Kerf Lite's tests, the VST3 and its Inno Setup installer, the raw .vst3 zip and
# the Tauri desktop app; then a GitHub release with those files, and a commit to main that adds
# them to downloads/ and points index.html at them (kerf.monco.io serves main). Any failing step
# stops the run before anything is published.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Read and check the version
        id: ver
        run: |
          ver=$(sed -n 's/^project(KerfPlugin VERSION \([0-9.]*\)).*/\1/p' plugin/CMakeLists.txt | tr -d '\r')
          [ -n "$ver" ] || { echo "::error::No version found in plugin/CMakeLists.txt"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$ver" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin/CMakeLists.txt version $ver"; exit 1
          fi
          for f in plugin/installer/KerfLite.iss src-tauri/tauri.conf.json src-tauri/Cargo.toml; do
            grep -q "\"$ver\"" "$f" || { echo "::error::$f is not at version $ver"; exit 1; }
          done
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      # JUCE is pulled by FetchContent here; CMake picks the runner's Visual Studio.
      - name: Configure Kerf Lite
        run: cmake -S plugin -B plugin/build -A x64

      - name: Build and run the tests
        run: |
          cmake --build plugin/build --config Release --target KerfTests
          ./plugin/build/KerfTests_artefacts/Release/KerfTests.exe

      - name: Build Kerf Lite (VST3)
        run: cmake --build plugin/build --config Release --target Kerf_VST3

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc plugin\installer\KerfLite.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Zip the raw VST3 folder
        shell: pwsh
        run: Compress-Archive -Force -DestinationPath 'downloads/KerfLite_${{ steps.ver.outputs.version }}_Beta_VST3_x64.zip' -LiteralPath 'plugin/build/Kerf_artefacts/Release/VST3/Kerf Lite (Beta).vst3'

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the desktop app (Tauri)
        run: |
          npm install --no-audit --no-fund
          npm run tauri build

      - name: Collect the desktop app
        run: |
          v='${{ steps.ver.outputs.version }}'
          cp "src-tauri/target/release/bundle/nsis/Kerf_${v}_x64-setup.exe" downloads/
          cp "src-tauri/target/release/bundle/msi/Kerf_${v}_x64_en-US.msi" downloads/

      - name: Point index.html at the new files
        shell: python
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          import os, pathlib, re
          new = os.environ["VER"]
          page = pathlib.Path("index.html")
          s = page.read_bytes().decode("utf-8")
          old = re.search(r"downloads/Kerf_([0-9.]+)_x64-setup\.exe", s).group(1)
          s = s.replace(f"KerfLite_{old}_", f"KerfLite_{new}_").replace(f"Kerf_{old}_", f"Kerf_{new}_")
          s = re.sub(r"\bv" + re.escape(old) + r"\b", "v" + new, s)
          page.write_bytes(s.encode("utf-8"))
          missing = [f for f in re.findall(r'href="(downloads/[^"]+)"', s) if not pathlib.Path(f).is_file()]
          if missing:
              raise SystemExit(f"index.html links to missing files: {missing}")
          print(f"index.html now points at {new} (was {old})")

      - uses: actions/upload-artifact@v5
        with:
          name: kerf-${{ steps.ver.outputs.version }}
          path: |
            downloads/KerfLite_${{ steps.ver.outputs.version }}_*
            downloads/Kerf_${{ steps.ver.outputs.version }}_*
          if-no-files-found: error

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          files=(downloads/KerfLite_"${VER}"_* downloads/Kerf_"${VER}"_*)
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" "${files[@]}" --clobber
          else
            gh release create "v$VER" "${files[@]}" --title "Kerf $VER (Beta)" \
              --notes "Windows x64: the Kerf desktop app (.exe or .msi) and Kerf Lite, the VST3 slicer (installer or raw .vst3 zip). Changes: see CHANGELOG.md. The browser version is always at https://kerf.monco.io/kerf.html"
          fi

      - name: Add the files to downloads/ on main (kerf.monco.io)
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin main
          git checkout -B main FETCH_HEAD
          git add index.html downloads/KerfLite_"${VER}"_* downloads/Kerf_"${VER}"_*
          if git diff --cached --quiet; then echo "Nothing new to commit"; exit 0; fi
          git commit -m "Release $VER: desktop app and Kerf Lite installers"
          git push origin main

      - name: Ask GitHub Pages to rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null || echo "::notice::Pages rebuild request not accepted; the site updates on its next build"
